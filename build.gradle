import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
	id 'maven-publish'
	id 'fabric-loom' version '1.6-SNAPSHOT'
  	id "org.jetbrains.kotlin.jvm" version "1.9.22"
}

version = "mc${ project.minecraft_version }-v${ project.mod_version }"
group = project.maven_group

base { archivesName = project.archives_base_name }

repositories {

	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	maven { url = "https://jitpack.io" }

}

loom {

	splitEnvironmentSourceSets()

	mods {

		"harmony" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}

		"honkytones" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}

	}

}

dependencies {

	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

	modImplementation "com.github.EngineMachiner:Harmony:1.20.3-SNAPSHOT"

	include( implementation( 'com.fasterxml.jackson.module:jackson-module-kotlin:2.17.2' ) )
	include( implementation( 'com.fasterxml.jackson.core:jackson-core:2.17.2' ) )
	include( implementation( 'com.fasterxml.jackson.core:jackson-databind:2.17.2' ) )
	include( implementation( 'com.fasterxml.jackson.core:jackson-annotations:2.17.2' ) )
	include( implementation( 'com.fasterxml.jackson:jackson-bom:2.17.2' ) )

	include( implementation( 'commons-validator:commons-validator:1.9.0' ) )

	include( implementation( 'com.googlecode.soundlibs:mp3spi:1.9.5.4' ) )
	include( implementation( 'com.googlecode.soundlibs:tritonus-share:0.3.7.4' ) )
	include( implementation( 'javazoom:jlayer:1.0.1' ) )

	include( implementation( 'com.squareup.okhttp3:okhttp:5.0.0-alpha.14' ) )
	include( implementation( 'com.squareup.okio:okio:3.9.0' ) )

}

processResources {

	inputs.property "version", project.version

	filesMatching("fabric.mod.json") { expand "version": project.version }

}

tasks.withType(JavaCompile).configureEach { it.options.release = 17 }

tasks.withType( KotlinCompile ).configureEach {
	kotlinOptions { jvmTarget = 17 }
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") { rename { "${it}_${ project.base.archivesName.get() }" } }
}

// configure the maven publication
publishing {

	publications {

		create( "mavenJava", MavenPublication ) {
			artifactId = project.archives_base_name;		from components.java
		}

	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}

}

fabricApi { configureDataGeneration() }